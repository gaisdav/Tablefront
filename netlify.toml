# Static deploy of the demo build (the mock API is part of the bundle, so no server is needed).
[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_ENABLE_MOCKS = "true"

# Single-page app: every other address is a route handled in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mockServiceWorker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# (HTML is served with `max-age=0, must-revalidate` by default, so a new deploy is picked up.)
