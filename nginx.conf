server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # A location that sets any header of its own drops the ones set above it, so the headers that
  # every response should carry are repeated in each location.

  # Hashed build output: the name changes with the content, so it can be cached for good. A file
  # that is not there is a real 404 (a stale link to an old bundle must not get the page back).
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # The mock service worker is looked up by the browser on its own schedule; it must never be
  # served stale, and it needs this header to control the whole site.
  location = /mockServiceWorker.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Any other address that names a file (an extension) is a file or a 404, never the app: a missing
  # script, map, manifest or icon must not come back as HTML with a 200.
  location ~* \.[a-z0-9]+$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Single-page app: an address without an extension is a route handled in the browser. The page
  # itself is revalidated every time so a new deploy is picked up (its asset links change with
  # each build).
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri /index.html;
  }
}
