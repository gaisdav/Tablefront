server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;

  # Hashed build output: the name changes with the content, so it can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # The mock service worker is looked up by the browser on its own schedule; it must never be
  # served stale, and it needs this header to control the whole site.
  location = /mockServiceWorker.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }

  # Single-page app: any other address is a route handled in the browser. The page itself is
  # revalidated every time so a new deploy is picked up (its asset links change with each build).
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ /index.html;
  }
}
