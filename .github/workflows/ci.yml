name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are noise; every commit on main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t tablefront .
      - name: Serve it and check what it serves
        run: |
          docker run -d --name tablefront -p 8080:8080 tablefront
          scripts/check-image.sh http://localhost:8080
      - name: Container log
        if: failure()
        run: docker logs tablefront

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the demo (mock API on), serves it, and runs the browser tests against it.
      - run: pnpm test:e2e
      # Traces and screenshots of the failed tests, to replay with `playwright show-trace`.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
